name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: AndroidMonitor
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests
        run: swift test
      - name: Build
        run: ./Scripts/build-release.sh
